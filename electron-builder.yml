appId: me.adatje.goonlib
productName: GoonLib
copyright: Copyright © 2026 @Adatje

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Native binaries and modules cannot be executed from inside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@ffprobe-installer/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/better-sqlite3/**

mac:
  icon: build/icon.icns
  category: public.app-category.photography
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # The app reads media the user explicitly points it at, and requests no camera,
  # microphone, or network permissions. Bluetooth is the one exception: the
  # Intiface engine it launches to reach a toy is unsigned and cannot ask for
  # itself, so macOS asks on GoonLib's behalf — and kills the engine outright if
  # the app has no reason on file to show.
  extendInfo:
    NSBluetoothAlwaysUsageDescription: GoonLib connects to your toy over Bluetooth, only when you ask it to.
  darkModeSupport: true

dmg:
  title: GoonLib ${version}

win:
  icon: build/icon.png
  target:
    - nsis

# The default installer is one click and no questions, which puts a media
# library somewhere under AppData without saying so. This one asks.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: GoonLib

linux:
  icon: build/icon.png
  # Images and video both, which is what this category is for.
  category: AudioVideo;Graphics;Viewer
  desktop:
    entry:
      Keywords: media;library;images;video;
  target:
    - AppImage

# Where the app looks for a newer version of itself. The repository is public, so
# the updater reads it over plain HTTPS with no token compiled in. This also makes
# each build write the latest*.yml manifests the updater needs; the release
# workflow attaches them alongside the installers.
publish:
  provider: github
  owner: adatje
  repo: goonlib

# better-sqlite3 is a V8-ABI module and must be rebuilt against Electron's headers.
npmRebuild: true
